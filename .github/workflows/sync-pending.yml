name: Sync pending application changes

on:
  push:
    paths:
      - ".github/workflows/sync-pending.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified application files
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/generico_pending.tgz
          tar -xzf /tmp/generico_pending.tgz
          rm -f .github/workflows/sync-pending.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish CMS, catalogs, news and cookie consent'
          git push
